name: Weekly ASIN Health Check

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  asin-health:
    name: Validate ASIN liveness and product mappings (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Enforce direct-ASIN liveness and title validation
        id: validate
        env:
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
          CREATORS_API_CLIENT_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_API_CLIENT_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
        run: node scripts/validate-asins.mjs 2>&1 | tee /tmp/asin_output.txt

      - name: Report dead or mis-mapped ASINs in a weekly issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const safe = (value) => String(value ?? '')
              .replace(/\|/g, '\\|')
              .replace(/[\r\n]+/g, ' ')
              .trim();

            let livenessOutput = '';
            let mappingReport = {};
            try {
              livenessOutput = fs.readFileSync('/tmp/asin_output.txt', 'utf8');
            } catch (e) {
              console.log('No liveness output found; continuing with mapping report if available.');
            }
            try {
              mappingReport = JSON.parse(fs.readFileSync('/tmp/asin_mapping_report.json', 'utf8'));
            } catch (e) {
              console.log('No mapping report found; continuing with liveness output if available.');
            }

            const brokenLines = livenessOutput.split('\n').filter(line =>
              line.includes('BROKEN') || line.includes('NOT_FOUND') || line.includes('404') || line.includes('❌')
            );
            const mappingFindings = (mappingReport.findings || []).filter(f =>
              f.verdict === 'MISMATCH' || f.verdict === 'DEAD'
            );

            if (brokenLines.length === 0 && mappingFindings.length === 0) {
              console.log('All conclusive ASIN liveness and mapping checks passed — no issue needed.');
              return;
            }

            const mappingLines = mappingFindings.map(f =>
              `| \`${safe(f.asin)}\` | ${safe(f.product || 'unknown')} | ${safe(f.amazon_title || 'not returned')} | ${f.score == null ? '—' : `${Math.round(f.score * 100)}%`} | ${safe(f.verdict)} |`
            );
            const total = brokenLines.length + mappingFindings.length;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ASIN HEALTH: ${total} issue(s) detected — ${new Date().toISOString().slice(0, 10)}`,
              body: [
                '## Weekly ASIN Health Check',
                '',
                '### DEAD ASINs',
                brokenLines.length
                  ? ['```', ...brokenLines, '```'].join('\n')
                  : 'No dead ASINs found by the existing liveness check.',
                '',
                '## MIS-MAPPED LINKS',
                mappingLines.length
                  ? ['| ASIN | Catalog Product | Amazon Title | Score | Verdict |', '|------|-----------------|--------------|-------|---------|', ...mappingLines].join('\n')
                  : 'No mismatched or dead ASIN mappings found by the context-aware check.',
                '',
                '**Action required:** Review every reported dead or mis-mapped link before the next content publish. INCONCLUSIVE results are intentionally excluded and never block the workflow.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['asin-health'],
            });
            console.log(`Opened issue for ${brokenLines.length} dead and ${mappingFindings.length} mis-mapped/dead mapping finding(s).`);
