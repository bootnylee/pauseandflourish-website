# PauseAndFlourish.com — Netlify Configuration

[build]
  command = "pnpm install && node scripts/validate-commerce-template.mjs && node scripts/validate-asins.mjs && if [ -n \"$CREATORS_API_CLIENT_ID\" ] && [ -n \"$CREATORS_API_CLIENT_SECRET\" ] && [ -n \"$CREATORS_API_PARTNER_TAG\" ]; then node scripts/fetch-prices.js; else echo 'Creators API credentials unavailable; price UI will hide catalog values.'; fi && npx tsx scripts/extract-data.ts && pnpm exec tsx scripts/render-static-bodies.tsx && node scripts/generate-sitemap.mjs && pnpm build && node scripts/prerender.mjs && echo ${COMMIT_REF:-local} > dist/public/version.txt"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  # Remote Creators API and Amazon responses are advisory; local template checks remain blocking.
  ASIN_VALIDATE = "warn"

# ── Domain normalization: www → non-www (301) ────────────────────────────────
[[redirects]]
  from = "https://www.pauseandflourish.com/*"
  to   = "https://pauseandflourish.com/:splat"
  status = 301
  force  = true

# ── Canonical detail-route form: no trailing slash ───────────────────────────
# Detail pages are emitted as flat .html artifacts. Netlify's Pretty URLs
# serve their extensionless form directly and handle slash normalization before
# redirect rules run; explicit slash-removal rules would therefore self-loop.

# ── Legacy subscribe alias — protects stale cached frontend bundles ───────────
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# ── Unknown routes return a true static 404 response. Existing prerendered
# route files and static assets take precedence because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ─────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache sitemap for 1 day ───────────────────────────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Cache robots.txt for 1 week ───────────────────────────────────────────────
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── PDF guides — correct Content-Type + download header ──────────────────────
[[headers]]
  for = "/guides/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"
